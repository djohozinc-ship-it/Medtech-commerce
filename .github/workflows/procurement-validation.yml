name: Validate procurement branch

on:
  push:
    branches:
      - feature/benin-commerce-adaptation
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: mongodb://127.0.0.1:27017/medtech-commerce-ci
      PAYLOAD_SECRET: ci-only-secret-do-not-use-in-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      S3_BUCKET: ci-placeholder
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Payload types
        run: pnpm generate:types
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
