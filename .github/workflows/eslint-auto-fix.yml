name: ESLint auto-fix (feature branch only)

on:
  push:
    branches:
      - feature/benin-commerce-adaptation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/benin-commerce-adaptation
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run safe ESLint auto-fixes
        run: pnpm exec eslint . --fix
        continue-on-error: true
      - name: Commit auto-fixes if any
        run: |
          if git diff --quiet; then
            echo "No auto-fixable changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply ESLint auto-fixes"
          git push origin feature/benin-commerce-adaptation
