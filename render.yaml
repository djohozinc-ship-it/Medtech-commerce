services:
  - type: web
    name: medtech-commerce-benin
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SERVER_URL
        value: https://medtech-commerce-benin.onrender.com
      - key: DATABASE_URI
        sync: false
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: FEDAPAY_ENV
        value: sandbox
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
